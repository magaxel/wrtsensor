name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check custom_components/wrtsensor diagnose.py tests
      - name: Ruff format
        run: ruff format --check custom_components/wrtsensor diagnose.py tests
      - name: Shellcheck
        run: shellcheck custom_components/wrtsensor/openwrt_collector.sh
      - name: Validate JSON
        run: |
          jq . custom_components/wrtsensor/manifest.json > /dev/null
          jq . custom_components/wrtsensor/strings.json > /dev/null
          jq . custom_components/wrtsensor/translations/en.json > /dev/null
          jq . hacs.json > /dev/null

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python3 -m pytest tests/ -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
